services:
  trip-planner:
    build:
      context: .
      args:
        VITE_AMAP_KEY: ${VITE_AMAP_KEY:-}
        VITE_AMAP_SECURITY_CODE: ${VITE_AMAP_SECURITY_CODE:-}
        VITE_API_BASE: ${VITE_API_BASE:-}
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8000
    ports:
      - "8000:8000"
    restart: unless-stopped
